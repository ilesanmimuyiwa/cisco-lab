- hosts: cisco
  gather_facts: false
  vars:
    intended: |
      interface Loopback0
       description Ansible lab loopback
       ip address 10.255.255.1 255.255.255.255
  tasks:
    - name: Get current Loopback0 config
      cisco.ios.ios_command:
        commands: show running-config | section interface Loopback0
      register: current

    - name: Save current config (before)
      ansible.builtin.copy:
        content: "{{ current.stdout[0] | trim }}\n"
        dest: "/tmp/{{ inventory_hostname }}-Loopback0.cfg"
      delegate_to: localhost
      check_mode: false
      diff: false

    - name: Compare with intended (after)
      ansible.builtin.copy:
        content: "{{ intended }}"
        dest: "/tmp/{{ inventory_hostname }}-Loopback0.cfg"
      delegate_to: localhost
      check_mode: true
      diff: true
