- hosts: cisco
  gather_facts: false
  tasks:
    - name: Get current Loopback0 config
      cisco.ios.ios_command:
        commands: show running-config | section interface Loopback0
      register: current

    - name: Save current (before)
      ansible.builtin.copy:
        content: "{{ current.stdout[0] | trim }}\n"
        dest: "/tmp/{{ inventory_hostname }}-Loopback0.cfg"
      delegate_to: localhost
      check_mode: false
      diff: false

    - name: Compare with intended (after)
      ansible.builtin.copy:
        content: |
          interface Loopback0
           description {{ loopback0.description }}
           ip address {{ loopback0.ip }}
        dest: "/tmp/{{ inventory_hostname }}-Loopback0.cfg"
      delegate_to: localhost
      check_mode: true
      diff: true
